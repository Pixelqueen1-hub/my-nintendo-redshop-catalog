name: Publish Catalog

on:
  push:
    branches:
      - main
    paths:
      - Gamed.json

  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout private repository
        uses: actions/checkout@v4

      - name: Publish Gamed.json
        env:
          GH_TOKEN: ${{ secrets.CATALOG_REPO_TOKEN }}
        run: |
          set -e

          git clone \
            https://x-access-token:${GH_TOKEN}@github.com/Pixelqueen1-hub/my-nintendo-redshop-catalog.git \
            catalog-repo

          cp Gamed.json catalog-repo/Gamed.json

          cd catalog-repo

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add Gamed.json

          if git diff --cached --quiet; then
            echo "Gamed.json has not changed."
            exit 0
          fi

          git commit -m "Update catalog"
          git push
